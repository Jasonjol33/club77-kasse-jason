# fly.toml app configuration file generated for club77-kasse-jason on 2026-11-13T19:25:12Z
#
# See https://docs.fly.io/reference/configuration for information about how to use this file.
#

app = 'club77-kasse-jason'
primary_region = 'fra'

[build]
[env]
  CLUB_TIMEZONE = 'Europe/Berlin'
  DATA_DIR = '/data'
  DAY_START_HOUR = '6'
  MAX_STAFF_DISCOUNT = '100'
  NODE_ENV = 'production'
  PORT = '8080'

[[mounts]]
  source = 'club77_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 2048
